{% extends "base.html" %}

{% block estilos %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  :root {
    --primary: #3a6fd8; --primary-dark: #1a3a5a; --accent: #dce6f8; --accent-soft: #eef4ff;
    --text-main: #1a1a2e; --text-muted: #64748b; --bg-light: #f8faff; --bg-page: #eef2fa;
    --border-color: #e2e8f0; --danger: #ef4444; --danger-soft: #fee2e2;
    --shadow-md: 0 4px 16px -2px rgba(26,58,90,0.10), 0 2px 6px -1px rgba(0,0,0,0.04);
    --radius: 16px; --radius-sm: 10px; --radius-xs: 7px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    background-image: url("/static/img/Huellas.png");
    background-size: 380px auto;
    background-repeat: repeat;
    background-attachment: fixed;
    background-color: #f5f8ff; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text-main); }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(240, 245, 255, 0.84);
    backdrop-filter: blur(1px);
    z-index: 0;
    pointer-events: none;
  }
  .edit-wrapper { position: relative; z-index: 1; }
  .edit-wrapper { max-width: 750px; margin: 3rem auto; padding: 0 1rem; }
  .edit-header { margin-bottom: 2rem; }
  .edit-header h2 { font-size: 1.7rem; font-weight: 800; color: var(--primary-dark); letter-spacing: -0.02em; margin-bottom: 0.2rem; }
  .edit-header p { font-size: 0.9rem; color: var(--text-muted); }
  .card { background: white; border-radius: var(--radius); padding: 2rem 2.2rem; box-shadow: var(--shadow-md); border: 1px solid var(--border-color); }
  .seccion-titulo { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--primary); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 8px; }
  .seccion-titulo::after { content: ''; flex: 1; height: 1.5px; background: linear-gradient(to right, var(--accent), transparent); border-radius: 2px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
  label { display: block; font-size: 0.74rem; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em; }
  input, select, textarea { width: 100%; padding: 10px 13px; border: 1.5px solid var(--border-color); border-radius: var(--radius-xs); background: var(--bg-light); font-family: inherit; font-size: 0.9rem; color: var(--text-main); transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(58,111,216,0.1); outline: none; background: white; }
  .error-msg { color: var(--danger); font-size: 0.82rem; background: var(--danger-soft); padding: 10px 14px; border-radius: var(--radius-xs); margin-bottom: 1.2rem; font-weight: 600; }
  .btn-row { display: flex; gap: 12px; align-items: center; margin-top: 24px; }
  .btn-guardar { padding: 11px 30px; background: #3a6fd8; color: white; border: none; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.9rem; font-family: inherit; cursor: pointer; }
  .btn-guardar:hover { background: #2d58b0; }
  .btn-cancelar { padding: 11px 22px; background: white; color: var(--text-muted); border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); text-decoration: none; font-size: 0.88rem; font-weight: 600; font-family: inherit; transition: border-color 0.2s, color 0.2s; }
  .btn-cancelar:hover { border-color: var(--primary); color: var(--primary); }
</style>
{% endblock %}

{% block content %}
<div class="edit-wrapper">
  <div class="edit-header">
    <h2>Actualizar Bitácora</h2>
    <p>Corrige los datos del registro y guarda los cambios.</p>
  </div>
  <div class="card">
    <p class="seccion-titulo">Datos de la Consulta</p>
    {% if errores %}
      <div class="error-msg">{% for key, msg in errores.items() %}{{ msg }}{% endfor %}</div>
    {% endif %}
    <form method="POST" action="/admin/actualizar-bitacora/{{ b.id_bitacora }}">
      <input type="hidden" name="id_mascota" value="{{ id_mascota }}" />
      <div class="form-grid" style="margin-bottom: 16px;">
        <div>
          <label>Fecha de Consulta</label>
          <input type="text" name="fecha" value="{{ b.fecha }}" placeholder="DD/MM/AAAA o AAAA-MM-DD" required />
        </div>
        <div>
          <label>Tipo de Evento</label>
          <select name="tipo_evento">
            <option value="Consulta" {% if b.tipo_evento == 'Consulta' %}selected{% endif %}>Consulta General</option>
            <option value="Control" {% if b.tipo_evento == 'Control' %}selected{% endif %}>Control / Seguimiento</option>
            <option value="Urgencia" {% if b.tipo_evento == 'Urgencia' %}selected{% endif %}>Urgencia Médica</option>
            <option value="Cirugía" {% if b.tipo_evento == 'Cirugía' %}selected{% endif %}>Procedimiento Quirúrgico</option>
            <option value="Vacunación" {% if b.tipo_evento == 'Vacunación' %}selected{% endif %}>Campaña Vacunación</option>
          </select>
        </div>
      </div>
      <div style="display:grid; gap:14px;">
        <div>
          <label>Motivo</label>
          <input type="text" name="motivo" value="{{ b.motivo }}" required />
        </div>
        <div class="form-grid">
          <div><label>Síntomas</label><input type="text" name="sintomas" value="{{ b.sintomas }}" required /></div>
          <div><label>Diagnóstico</label><input type="text" name="diagnostico" value="{{ b.diagnostico }}" required /></div>
        </div>
        <div>
          <label>Procedimiento Realizado</label>
          <input type="text" name="procedimiento" value="{{ b.procedimiento }}" required />
        </div>
        <div class="form-grid">
          <div><label>Medicación Prescrita</label><input type="text" name="medicacion" value="{{ b.medicacion }}" /></div>
          <div><label>Observaciones Médicas</label><input type="text" name="observaciones" value="{{ b.observaciones }}" required /></div>
        </div>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn-guardar">Actualizar</button>
        <a href="/admin/dashboard?mascota_id={{ id_mascota }}#bitacora" class="btn-cancelar">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
