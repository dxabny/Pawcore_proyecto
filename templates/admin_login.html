<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Veterinario - PawCore</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #e8f0fe 0%, #dbeafe 40%, #bfdbfe 100%);
    }

    .card {
      background: white;
      padding: 2.5rem 2.4rem;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(59, 130, 246, 0.14), 0 2px 8px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(147, 197, 253, 0.4);
    }

    .card-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .card-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 1.4rem;
      box-shadow: 0 4px 12px rgba(59,130,246,0.28);
    }
    .card-header h2 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1e3a5f;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .card-header p {
      font-size: 0.87rem;
      color: #64748b;
    }

    .error-alert {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #dc2626;
      padding: 11px 15px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 500;
      margin-bottom: 1.4rem;
      text-align: center;
    }

    .field-group { margin-bottom: 1.1rem; }
    .field-error { color: #dc2626; font-size: 0.77rem; margin-top: 4px; font-weight: 500; min-height: 16px; }

    label {
      display: block;
      font-size: 0.77rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: 1.5px solid #dbeafe;
      border-radius: 10px;
      font-size: 0.93rem;
      font-family: inherit;
      background: #f8fbff;
      color: #1e3a5f;
      outline: none;
      transition: all 0.2s;
    }
    input:focus {
      border-color: #3b82f6;
      background: white;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.11);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.97rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.15s;
      letter-spacing: 0.01em;
      box-shadow: 0 3px 12px rgba(59,130,246,0.35);
    }
    .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }

    .footer-link {
      text-align: center;
      margin-top: 1.4rem;
      font-size: 0.87rem;
      color: #64748b;
      border-top: 1px solid #edf2f7;
      padding-top: 1.2rem;
    }
    .footer-link a { color: #3b82f6; font-weight: 600; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="card-icon">🩺</div>
      <h2>Acceso Veterinario</h2>
      <p>Ingresa tus credenciales para continuar</p>
    </div>

    {% if error %}
    <div class="error-alert">{{ error }}</div>
    {% endif %}

    <form action="/admin/login" method="post">
      <div class="field-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario" required minlength="2" autocomplete="username">
      </div>

      <div class="field-group">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required minlength="4" autocomplete="current-password">
      </div>

      <button type="submit" class="btn-submit">Ingresar al Panel</button>
    </form>

    <div class="footer-link">
      <a href="/">← Volver al inicio</a>
    </div>
  </div>



</body>
</html>
