<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - PawCore</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background-image: url('/static/img/perro.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: #eef2fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(235, 242, 255, 0.80);
      z-index: 0;
      pointer-events: none;
    }

    .header-logo, .card { position: relative; z-index: 1; }

    .header-logo {
      position: fixed;
      top: 22px;
      left: 28px;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a1a2e;
      text-decoration: none;
      letter-spacing: -0.02em;
    }
    .logo span { color: #3a6fd8; }

    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(26,26,46,0.09);
      width: 100%;
      max-width: 390px;
      border: 1px solid #e2e8f0;
    }

    .card-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .card-header h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.02em;
    }

    .card-header p {
      font-size: 0.88rem;
      color: #64748b;
      margin-top: 6px;
    }

    /* ERROR GLOBAL */
    .error-alert {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #dc2626;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .success-alert {
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #16a34a;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .field-group { margin-bottom: 1.1rem; }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.92rem;
      font-family: inherit;
      background: #f8faff;
      color: #1a1a2e;
      outline: none;
      transition: all 0.2s;
    }
    input:focus {
      border-color: #3a6fd8;
      background: white;
      box-shadow: 0 0 0 3px rgba(58,111,216,0.12);
    }

    .input-error { border-color: #dc2626 !important; background: #fef2f2 !important; }
    .error-text { color: #dc2626; font-size: 0.78rem; font-weight: 600; margin-top: 5px; display: block; }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: #3a6fd8;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.97rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-top: 6px;
      transition: background 0.2s;
    }
    .btn-login:hover { background: #2d58b0; }

    .footer-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.88rem;
      color: #64748b;
      border-top: 1px solid #edf2f7;
      padding-top: 1.2rem;
    }
    .footer-link a { color: #3a6fd8; font-weight: 600; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
    .forgot-link { color: #64748b !important; font-weight: 500 !important; font-size: 0.85rem; }
    .forgot-link:hover { color: #3a6fd8 !important; }
  </style>
</head>
<body>

  <div class="header-logo">
    <a href="/" class="logo">Paw<span>Core</span></a>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Bienvenido</h2>
      <p>Ingresa con tu cédula para acceder</p>
    </div>

    {% if recuperado %}
    <div class="success-alert">✅ ¡Contraseña actualizada! Ya puedes iniciar sesión con tu nueva contraseña.</div>
    {% endif %}

    {% if error %}
    <div class="error-alert">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="field-group">
        <label for="cedula">Cédula</label>
        <input type="text" id="cedula" name="cedula" placeholder="Ej: 1020304050" required>
      </div>

      <div class="field-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-login">Entrar a PawCore</button>
    </form>

    <div class="footer-link">
      <a href="/recuperar-contrasena" class="forgot-link">¿Olvidaste tu contraseña?</a>
    </div>

    <div class="footer-link" style="margin-top: 0.75rem;">
      ¿No tienes cuenta? <a href="/registro">Regístrate aquí</a>
    </div>
  </div>

</body>
</html>
